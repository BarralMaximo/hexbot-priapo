<line x1="130" y1="158" x2="130" y2="200" class="ea" stroke-width="2.4"/>
<circle cx="55" cy="116" r="9" class="n" stroke-width="1.6"/>
<circle cx="155" cy="116" r="9" class="n" stroke-width="1.6"/>
<circle cx="80" cy="158" r="9" class="n" stroke-width="1.6"/>
<circle cx="105" cy="74" r="9" class="na" stroke-width="1.6"/>
<circle cx="105" cy="116" r="9" class="na" stroke-width="1.6"/>
<circle cx="130" cy="158" r="9" class="na" stroke-width="1.6"/>
<circle cx="130" cy="200" r="9" class="na" stroke-width="1.6"/>
<text x="118.0" y="67.0" text-anchor="start" class="t1" font-size="10" font-weight="700">+1</text>
<text x="118.0" y="109.0" text-anchor="start" class="t1" font-size="10" font-weight="700">+1</text>
<text x="143.0" y="151.0" text-anchor="start" class="t1" font-size="10" font-weight="700">+1</text>
<text x="143.0" y="193.0" text-anchor="start" class="t1" font-size="10" font-weight="700">+1</text>
<line x1="192" y1="206" x2="192" y2="80" class="ea" stroke-width="1.4"/><path d="M187,84 L192,74 L197,84 Z" class="fa"/>
<text x="105.0" y="278.0" text-anchor="middle" class="t2" font-size="11">update visits, wins</text>
<text x="105.0" y="293.0" text-anchor="middle" class="t2" font-size="11">and RAVE stats</text>
</g>
<text x="630.0" y="124.0" text-anchor="middle" class="t2" font-size="20">→</text>
</svg>
