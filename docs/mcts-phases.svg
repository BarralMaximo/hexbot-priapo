<line x1="105" y1="74" x2="155" y2="116" class="e" stroke-width="1.2"/>
<line x1="105" y1="116" x2="80" y2="158" class="e" stroke-width="1.2"/>
<line x1="105" y1="74" x2="105" y2="116" class="es" stroke-width="2.4"/>
<line x1="105" y1="116" x2="130" y2="158" class="es" stroke-width="2.4"/>
<circle cx="55" cy="116" r="9" class="n" stroke-width="1.6"/>
<circle cx="155" cy="116" r="9" class="n" stroke-width="1.6"/>
<circle cx="80" cy="158" r="9" class="n" stroke-width="1.6"/>
<circle cx="105" cy="74" r="9" class="no" stroke-width="1.6"/>
<circle cx="105" cy="116" r="9" class="no" stroke-width="1.6"/>
<circle cx="130" cy="158" r="9" class="no" stroke-width="1.6"/>
<line x1="130" y1="158" x2="130" y2="200" class="ea" stroke-width="2" stroke-dasharray="4 3"/>
<circle cx="130" cy="200" r="9" class="na" stroke-width="1.6"/>
<text x="146.0" y="204.0" text-anchor="start" class="t2" font-size="10">new node</text>
<text x="105.0" y="278.0" text-anchor="middle" class="t2" font-size="11">add one untried move</text>
<text x="105.0" y="293.0" text-anchor="middle" class="t2" font-size="11">as a new child</text>
</g>
<text x="210.0" y="124.0" text-anchor="middle" class="t2" font-size="20">→</text>
<g transform="translate(420,0)">
<text x="105.0" y="36.0" text-anchor="middle" class="t1" font-size="12" font-weight="700" letter-spacing="1">3 · SIMULATION</text>
<line x1="105" y1="74" x2="55" y2="116" class="e" stroke-width="1.2"/>
<line x1="105" y1="74" x2="155" y2="116" class="e" stroke-width="1.2"/>
<line x1="105" y1="116" x2="80" y2="158" class="e" stroke-width="1.2"/>
<line x1="105" y1="74" x2="105" y2="116" class="e" stroke-width="1.2"/>
<line x1="105" y1="116" x2="130" y2="158" class="e" stroke-width="1.2"/>
<circle cx="55" cy="116" r="9" class="n" stroke-width="1.6"/>
<circle cx="155" cy="116" r="9" class="n" stroke-width="1.6"/>
<circle cx="80" cy="158" r="9" class="n" stroke-width="1.6"/>
<circle cx="105" cy="74" r="9" class="n" stroke-width="1.6"/>
<circle cx="105" cy="116" r="9" class="n" stroke-width="1.6"/>
<circle cx="130" cy="158" r="9" class="n" stroke-width="1.6"/>
<line x1="130" y1="158" x2="130" y2="200" class="e" stroke-width="1.2"/>
