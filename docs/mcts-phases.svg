<path d="M130,211 q-6,4 0,8 q6,4 0,8 q-6,4 0,8" fill="none" class="ei" stroke-width="1.4"/>
<rect x="124" y="239" width="12" height="12" rx="2" class="fa"/>
<text x="142.0" y="227.0" text-anchor="start" class="t2" font-size="10">random</text>
<text x="142.0" y="249.0" text-anchor="start" class="t2" font-size="10">win/loss</text>
<text x="105.0" y="278.0" text-anchor="middle" class="t2" font-size="11">random playout until</text>
<text x="105.0" y="293.0" text-anchor="middle" class="t2" font-size="11">a (virtual) win</text>
</g>
<text x="420.0" y="124.0" text-anchor="middle" class="t2" font-size="20">→</text>
<g transform="translate(630,0)">
<text x="105.0" y="36.0" text-anchor="middle" class="t1" font-size="12" font-weight="700" letter-spacing="1">4 · BACKPROPAGATION</text>
