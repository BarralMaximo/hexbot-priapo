<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 310" width="840" height="310" role="img" aria-label="The four phases of one MCTS iteration: selection, expansion, simulation, backpropagation">
<style>svg{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace} .bg{fill:#f6f8fa;stroke:#d0d7de} .t1{fill:#1f2328} .t2{fill:#59636e} .e{stroke:#8c959f} .es{stroke:#2a78d6} .ea{stroke:#a86e1f} .ei{stroke:#59636e} .n{fill:#ffffff;stroke:#8c959f} .ns{fill:#2a78d6;stroke:#2a78d6} .no{fill:#ffffff;stroke:#2a78d6} .na{fill:#a86e1f;stroke:#a86e1f} .fa{fill:#a86e1f} .grid{stroke:#e1e4e8} .axis{stroke:#8c959f} .dot{fill:#8c959f;stroke:#f6f8fa} .ring{fill:#f6f8fa;stroke:#1f2328} .hi{fill:#a86e1f;stroke:#f6f8fa}
@media (prefers-color-scheme: dark){ .bg{fill:#161b22;stroke:#30363d} .t1{fill:#e6edf3} .t2{fill:#9198a1} .e{stroke:#6e7681} .es{stroke:#3987e5} .ea{stroke:#b8843a} .ei{stroke:#9198a1} .n{fill:#0d1117;stroke:#6e7681} .ns{fill:#3987e5;stroke:#3987e5} .no{fill:#0d1117;stroke:#3987e5} .na{fill:#b8843a;stroke:#b8843a} .fa{fill:#b8843a} .grid{stroke:#262c34} .axis{stroke:#6e7681} .dot{fill:#6e7681;stroke:#161b22} .ring{fill:#161b22;stroke:#e6edf3} .hi{fill:#b8843a;stroke:#161b22} }</style>
<rect x="0.5" y="0.5" width="839" height="309" rx="10" class="bg"/>
<g transform="translate(0,0)">
<text x="105.0" y="36.0" text-anchor="middle" class="t1" font-size="12" font-weight="700" letter-spacing="1">1 · SELECTION</text>
<line x1="105" y1="74" x2="55" y2="116" class="e" stroke-width="1.2"/>
<line x1="105" y1="74" x2="155" y2="116" class="e" stroke-width="1.2"/>
<line x1="105" y1="116" x2="80" y2="158" class="e" stroke-width="1.2"/>
<line x1="105" y1="74" x2="105" y2="116" class="es" stroke-width="2.4"/>
<line x1="105" y1="116" x2="130" y2="158" class="es" stroke-width="2.4"/>
<circle cx="55" cy="116" r="9" class="n" stroke-width="1.6"/>
<circle cx="155" cy="116" r="9" class="n" stroke-width="1.6"/>
<circle cx="80" cy="158" r="9" class="n" stroke-width="1.6"/>
<circle cx="105" cy="74" r="9" class="ns" stroke-width="1.6"/>
<circle cx="105" cy="116" r="9" class="ns" stroke-width="1.6"/>
<circle cx="130" cy="158" r="9" class="ns" stroke-width="1.6"/>
<text x="146.0" y="176.0" text-anchor="start" class="t2" font-size="10">UCT+RAVE</text>
<text x="105.0" y="278.0" text-anchor="middle" class="t2" font-size="11">descend, picking the</text>
<text x="105.0" y="293.0" text-anchor="middle" class="t2" font-size="11">best-scoring child</text>
</g>
<g transform="translate(210,0)">
<text x="105.0" y="36.0" text-anchor="middle" class="t1" font-size="12" font-weight="700" letter-spacing="1">2 · EXPANSION</text>
